# ---------------------------------------------------------------------------
#  Frija v113 - the one logging configuration.
#
#  Wired by Launcher.bat:  -Djava.util.logging.config.file=Libs/logging.properties
#  (relative to the repo root, which is the working directory the server and
#  the wz->sql tools are both started in).
#
#  Everything in the server logs through java.lang.System.Logger, which with no
#  other provider on the classpath is backed by java.util.logging - and so is
#  MINA, because slf4j-jdk14 routes slf4j there. One file configures both.
#  The conventions (how a logger is named, which level replaces which of the
#  tree's old reporting mechanisms, what must not be converted) are documented
#  on src/tools/Logging.java.
#
#  ASCII only. LogManager reads this with java.util.Properties.load, which
#  decodes ISO-8859-1 - Chinese here would arrive as mojibake. Encodings are
#  chosen in code instead; see below.
#
#  Do not delete this file without also removing the -D from Launcher.bat.
#  Pointing java.util.logging.config.file at a file that is not there does NOT
#  fall back to the JDK's own conf/logging.properties and does NOT say a word:
#  LogManager ends up with no handlers and the console goes silent. Launcher.bat
#  therefore tests for this file before passing the property, and warns if it
#  has gone. Running with no property at all is safe - the JDK default applies,
#  and the Logs/*.rtf topic files work either way, because FileoutputUtil
#  attaches their handlers in code.
# ---------------------------------------------------------------------------

# The console. NOT java.util.logging.ConsoleHandler, for two reasons that a
# properties file cannot express:
#   - it writes to System.out rather than System.err, so the operator console
#     stays one ordered stream (and stays in order with the System.out.println
#     calls that have not been converted yet);
#   - its charset is Encodings.NATIVE, i.e. whatever native.encoding says -
#     MS950 here. A properties file can only name a fixed charset, and
#     Charset.defaultCharset() has been UTF-8 since JDK 18 (JEP 400), which on
#     this console is mojibake for every Chinese string the server prints.
# Its layout is the bare message below WARNING, so the startup banner prints
# byte for byte as it always has; at WARNING and above the level name is
# prefixed and any Throwable is appended in full.
handlers = tools.Logging$Console

# The default for every logger that does not set its own.
.level = INFO

# The handler takes everything the loggers let through; the levels above and
# below are what filter. (StreamHandler would otherwise default it to INFO and
# silently eat anything finer, whatever .level says.)
tools.Logging$Console.level = ALL

# Overrides, should they ever be wanted. Each one wins over the default that
# tools.Logging.Console applies in code.
#tools.Logging$Console.encoding  = UTF-8
#tools.Logging$Console.formatter = java.util.logging.SimpleFormatter
#java.util.logging.SimpleFormatter.format = %1$tF %1$tT %4$s %5$s%6$s%n

# MINA 1.1 arrives here through slf4j-jdk14. It is quiet at INFO and extremely
# loud below it; lower it only while debugging the network layer.
#org.apache.mina.level = FINE

# The Logs/*.rtf topic files. Each has a logger of its own under tms.*, wired
# by tools.FileoutputUtil, writing only to its file. Levels and routing are
# settable here:
#   tms.boss.level                = OFF    stop recording Zakum/Horntail/Pinkbean kills
#   tms.script.useParentHandlers  = true   put script exceptions on the console as well
#   tms.timer.level               = OFF    stop recording tasks that threw out of a Timer pool
# The files themselves are unaffected by whether this file exists at all.
#tms.boss.level = OFF

# tms.Debug's per-packet hex dumps. The sweep moved these to DEBUG, so as of
# 2026-09 tms.Debug = true in Settings.ini is necessary but no longer
# sufficient - one of the lines below has to be uncommented as well. Both
# sites check isLoggable() before building the dump, so leaving them commented
# out costs nothing on the packet path. There are two, and they see different
# things: the first is every packet the server RECEIVES, the second every
# packet it SENDS.
#handling.MapleServerHandler.level = FINE
#tools.data.output.MaplePacketLittleEndianWriter.level = FINE

# Per-package levels for the game itself.
#handling.channel.handler.level = FINE
#scripting.level = FINE
